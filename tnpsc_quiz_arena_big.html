<style>
:root{color-scheme:light dark;--bg:light-dark(#f2f5fb,#0d1220);--card:light-dark(#fff,#172034);--ink:light-dark(#17203a,#f2f5ff);--mut:light-dark(#5b667e,#a3aec5);--line:light-dark(#dce2ee,#2d3954);--ac:light-dark(#3a4bc0,#9aa8ff);--ok:light-dark(#127a4a,#5fd89b);--no:light-dark(#b3261e,#ff8a82);--gold:light-dark(#b45309,#fbbf24)}

.w{max-width:700px;margin:auto}.hero{margin-top:12px;background:linear-gradient(135deg,#3a4bc0,#0f766e);color:#fff;border-radius:22px;padding:20px}.hero h1{font-size:1.35rem;margin:2px 0 10px;line-height:1.3}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.hud div{background:#ffffff22;border-radius:12px;padding:7px 4px;text-align:center;font-size:.72rem}.hud b{display:block;font-size:1.1rem}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:.82rem;font-weight:700;cursor:pointer}.chip.on{background:var(--ac);color:light-dark(#fff,#0d1220);border-color:var(--ac)}
.top{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mut);font-weight:700}.bar{height:7px;background:var(--line);border-radius:9px;margin:10px 0 16px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}

.o:hover:not(:disabled){border-color:var(--ac);transform:translateY(-1px)}.o b{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);font-size:.85rem}

.tip{display:none;margin-top:12px;padding:12px 14px;border-radius:13px;border-left:4px solid var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent);font-size:.92rem}.tip.show{display:block;animation:f .25s}.tip.bad{border-color:var(--no);background:color-mix(in srgb,var(--no) 10%,transparent)}@keyframes f{from{opacity:0;transform:translateY(6px)}}

.tap{min-height:150px;font-size:1.5rem;background:var(--ac);color:light-dark(#fff,#0d1220);box-shadow:0 6px 0 light-dark(#2b3896,#6674bb);border-radius:22px}.tap:active{transform:translateY(3px);box-shadow:none}.tap:disabled{opacity:.5}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.st div{border:1px solid var(--line);border-radius:13px;text-align:center;padding:10px 4px;font-size:.78rem;color:var(--mut)}.st b{display:block;font-size:1.5rem;color:var(--ink)}

<script>
const D=[
['p','TVK-யின் விரிவாக்கம் என்ன?','தமிழக வெற்றிக் கழகம்',['தமிழ்நாடு வெற்றி முன்னணி','தமிழ் மக்கள் கழகம்','வெற்றி தமிழ் இயக்கம்'],'Tamilaga Vettri Kazhagam – தலைவர் C. ஜோசப் விஜய்; தலைமையகம் பனையூர், சென்னை.'],
['p','2026 தேர்தலில் TVK வென்ற தொகுதிகள்?','108',['118','98','144'],'234-ல் 108 – தனிப்பெரும் கட்சி; பெரும்பான்மைக்கு 118 தேவை.'],
['p','விஜய் பதவியேற்ற இடம்?','ஜவஹர்லால் நேரு உள்விளையாட்டு அரங்கம், சென்னை',['கலைவாணர் அரங்கம்','புனித ஜார்ஜ் கோட்டை','ராஜ்பவன்'],'ஆளுநர் ராஜேந்திர ஆர்லேகர் பதவிப்பிரமாணம் செய்து வைத்தார்.'],
['p','விஜய் பதவியேற்புக்கு ஆளுநராக இருந்தவர்?','ராஜேந்திர ஆர்லேகர்',['ஆர்.என். ரவி','பன்வாரிலால் புரோகித்','சி. வித்யாசாகர் ராவ்'],'ராஜேந்திர (R.V.) ஆர்லேகர் – தமிழ்நாடு ஆளுநர்.'],
['p','விஜய் ஆட்சியின் வரலாற்றுச் சிறப்பு?','1967-க்குப் பின் திராவிடக் கட்சி அல்லாத முதல் ஆட்சி',['முதல் பெண் முதல்வர்','முதல் தனிப்பெரும்பான்மை ஆட்சி','முதல் குடியரசுத் தலைவர் ஆட்சி'],'DMK/AIADMK மாறி மாறி ஆண்ட நிலை முடிவுக்கு வந்தது.'],
['p','நம்பிக்கை வாக்கெடுப்பில் அரசுக்கு ஆதரவான வாக்குகள்?','144',['118','108','166'],'சுமார் 25 அதிமுக MLA-க்கள் கட்சிக் கொறடா உத்தரவை மீறி ஆதரித்தனர்.'],
['p','TVK-க்கு தொடக்கத்தில் ஆதரவு தராத கட்சி?','பாஜக',['காங்கிரஸ்','விசிக','IUML'],'காங்கிரஸ், விசிக, IUML, இடதுசாரிகள் ஆதரவு தந்தன.'],
['p','சட்டப்பேரவைத் தலைவர் (Speaker)?','பிரபாகர்',['செங்கோட்டையன்','ராஜ்மோகன்','ஆதவ் அர்ஜுனா'],'Speaker Prabhakar (TVK).'],
['p','எதிர்க்கட்சித் தலைவர்?','உதயநிதி ஸ்டாலின் (DMK)',['எடப்பாடி பழனிசாமி','திருமாவளவன்','அன்புமணி'],'DMK-வின் உதயநிதி எதிர்க்கட்சித் தலைவர்.'],
['p','முதல்வர் விஜய் தன்வசம் வைத்துள்ள துறை?','உள்துறை',['நிதித்துறை','கல்வித்துறை','தொழில்துறை'],'Home (காவல்) துறையை முதல்வரே வைத்துள்ளார்.'],
['p','உயர்கல்வித் துறை அமைச்சர் (காங்கிரஸ்)?','பி. விஸ்வநாதன்',['ராஜ்மோகன் அருமுகம்','விஜய் தமிழன் பார்த்திபன்','எஸ். ரமேஷ்'],'மேலூர் MLA; காங்கிரஸின் 2 அமைச்சர்களில் ஒருவர்.'],
['p','போக்குவரத்து அமைச்சர்?','விஜய் தமிழன் பார்த்திபன்',['பி. விஸ்வநாதன்','எஸ். ரமேஷ்','பி. வெங்கட்ராமன்'],'சேலம் தெற்கு MLA – "மகளிர் பயணம்" பெயர் மாற்றத்தை அறிவித்தவர்.'],
['r','"மகளிர் விடியல் பயணம்" புதிய பெயர்?','மகளிர் பயணம்',['வெற்றிப் பயணம்','பெண்கள் பேருந்து','தாய்மாமன் பயணம்'],'"விடியல்" (DMK அடையாளச் சொல்) நீக்கப்பட்டது; பலன்கள் மாறவில்லை.'],
['r','"நான் முதல்வன்" புதிய பெயர்?','வெற்றி திறன் பயிற்சித் திட்டம்',['தமிழ் திறன் இயக்கம்','புதிய சிறகுகள்','காமராஜர் திறன் திட்டம்'],'12 லட்சம் மாணவர்கள் + 1 லட்சம் இளைஞர்களுக்குப் பயிற்சி.'],
['r','"கலைஞர் கனவு இல்லம்" புதிய பெயர்?','வெற்றி வீடு வழங்கும் திட்டம்',['அண்ணா இல்லம்','பசுமை வீடு','மண்ணின் மகள் இல்லம்'],'Vetri Veedu Vazhangum Thittam – ஒதுக்கீடு அதிகரிக்கப்பட்டது.'],
['r','"உங்கள் கையில் உலகம்" மடிக்கணினித் திட்டம் புதிய பெயர்?','வெற்றி மடிக்கணினித் திட்டம்',['காமராஜர் மடிக்கணினி','டிஜிட்டல் தமிழகம்','மாணவர் மின்னணு திட்டம்'],'கல்லூரி மாணவர்களுக்கு; ₹2,000 கோடி ஒதுக்கீடு.'],
['r','"இலவச மிதிவண்டி" திட்டம் புதிய பெயர்?','நவீன மிதிவண்டித் திட்டம்',['வெற்றி மிதிவண்டி','காமராஜர் சைக்கிள்','புதுமை சக்கரம்'],'Naveena Mithivandi – 11-ஆம் வகுப்புக்கு சைக்கிள் + ஹெல்மெட் + தண்ணீர் பாட்டில்.'],
['r','மாடல் / சிறப்புப் பள்ளிகள் புதிய பெயர்?','காமராஜர் சிறப்புப் பள்ளிகள்',['வெற்றிப் பள்ளிகள்','அண்ணா மாதிரிப் பள்ளிகள்','அம்பேத்கர் பள்ளிகள்'],'Kamarajar Special Schools.'],
['r','"நன்னிலம்" திட்டம் புதிய பெயர்?','மண்ணின் மகள் திட்டம்',['வெற்றி நிலம்','பெண் நில உரிமை','தாய்மண் திட்டம்'],'Mannin Magal Thittam – பெண்களுக்கு நில உரிமை.'],
['r','ஆடு வளர்ப்பு ஊக்குவிப்புத் திட்டம் புதிய பெயர்?','வெற்றி மகளிர் ஆடு வளர்ப்புத் திட்டம்',['மண்ணின் மகள் ஆடு திட்டம்','காமராஜர் கால்நடை திட்டம்','தாய்மாமன் ஆடு திட்டம்'],'Vetri Magalir Aadu Valarppu Thittam.'],
['r','"கலைஞர் மகளிர் உரிமைத் தொகை" புதிய பெயர்?','மகளிர் உரிமைத் திட்டம்',['வெற்றி மகளிர் தொகை','அண்ணன் சீர்','சிங்கப்பெண் திட்டம்'],'மாதம் ₹1,000 தொடர்கிறது; ₹2,500 உயர்வு பரிசீலனையில்.'],
['r','"முதலமைச்சரின் காலை உணவுத் திட்டம்" புதிய பெயர்?','பெருந்தலைவர் காமராஜர் காலை உணவுத் திட்டம்',['வெற்றி காலை உணவுத் திட்டம்','அண்ணா உணவுத் திட்டம்','அம்மா உணவகத் திட்டம்'],'6–8 வகுப்புகளுக்கும் விரிவாக்கம்.'],
['r','காலை உணவு விரிவாக்கத்தில் கூடுதலாகப் பயன்பெறும் மாணவர்கள்?','15.14 லட்சம்',['10 லட்சம்','12 லட்சம்','20 லட்சம்'],'15,414 பள்ளிகள்; ஒதுக்கீடு ₹710 கோடி.'],
